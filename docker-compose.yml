version: '3.8'

services:

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: grader
      POSTGRES_PASSWORD: adgadjhasg^jagsfgc891732
      POSTGRES_DB: grader
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U grader" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      - "5000:5000"
    environment:
      # libpq will pick these up
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=grader
      - PGUSER=grader
      - PGPASSWORD=adgadjhasg^jagsfgc891732

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
volumes:
  pg_data:
