services:

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # For local development:
    command: start-dev --import-realm
    # For production (uncomment):
    # command: start --hostname socoles.cs.ru.nl --proxy edge --import-realm
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # For local development:
      - "127.0.0.1:8080:8080"
      # For production (uncomment):
      # - "8080:8080"
    environment:
      # Admin console login (change in .env)
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Use Postgres for production-grade persistence
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=socoles-web
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD}
      # For production (uncomment):
      # - KC_HOSTNAME=socoles.cs.ru.nl
      # - KC_PROXY=edge
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD", "bash", "-lc", "curl -fsS http://localhost:8080/realms/master/.well-known/openid-configuration >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:14
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=socoles-web
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=manageclass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB:-postgres}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/berniegach/socoles-backend:1.0.1}
    # Uncomment to build locally instead of pulling
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      # open only for local development
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Backend connects to secondary grader DB
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=socoles-web
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=grader
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/berniegach/socoles-frontend:1.0.5}
    # Uncomment to build locally instead of pulling
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped
    ports:
      # For local development:
      - "127.0.0.1:3000:3000"
      # For production (uncomment):
      # - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_SOCOLES_API_URL=${NEXT_PUBLIC_SOCOLES_API_URL:-http://localhost:5000}
      - NEXT_PUBLIC_SOCOLES_GRADE_PATH=/grade-queries
      - SOCOLES_INTERNAL_API_URL=${SOCOLES_INTERNAL_API_URL:-http://backend:5000}
      # NextAuth + Keycloak
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # For production (uncomment):
      # - NEXTAUTH_URL=https://socoles.cs.ru.nl
      # - KEYCLOAK_ISSUER=https://socoles.cs.ru.nl/realms/socoles
      # - KEYCLOAK_ISSUER_PUBLIC=https://socoles.cs.ru.nl/realms/socoles
      # - KEYCLOAK_LOGOUT_REDIRECT_URI=https://socoles.cs.ru.nl
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/socoles}
      - KEYCLOAK_ISSUER_PUBLIC=${KEYCLOAK_ISSUER_PUBLIC:-http://localhost:8080/realms/socoles}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-socoles-frontend}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-change-me}
      - KEYCLOAK_LOGOUT_REDIRECT_URI=${KEYCLOAK_LOGOUT_REDIRECT_URI:-http://localhost:3000/}
      # Instructor provisioning
      - INSTRUCTOR_SIGNUP_CODE=${INSTRUCTOR_SIGNUP_CODE}
      # Frontend uses primary DB (manageclass)
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=socoles-web
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=manageclass
      # HOST optional for Next.js listen address; uncomment if needed
      # - HOST=0.0.0.0
    healthcheck:
      test: [ "CMD", "bash", "-lc", "node -e 'http.get(process.env.NEXT_PUBLIC_SOCOLES_API_URL||\"http://backend:5000\",r=>{process.exit(r.statusCode===200?0:1)}).on(\"error\",()=>process.exit(1))' " ]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  pg_data:
  keycloak_data:
