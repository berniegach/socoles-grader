services:

  db:
    image: postgres:14
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=socoles-web
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=manageclass
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U socoles-web" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/berniegach/socoles-backend:1.0.0}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      # open only for local development
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      # Backend connects to secondary grader DB
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=socoles-web
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=grader

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/berniegach/socoles-frontend:1.0.0}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_SOCOLES_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SOCOLES_GRADE_PATH=/grade-queries
      - SOCOLES_INTERNAL_API_URL=http://backend:5000
      # Frontend uses primary DB (manageclass)
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=socoles-web
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=manageclass
      # HOST optional for Next.js listen address; uncomment if needed
      # - HOST=0.0.0.0
volumes:
  pg_data:
