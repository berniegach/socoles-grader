services:

  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: back-user
      POSTGRES_PASSWORD: adgadjhasg^jagsfgc891732
      POSTGRES_DB: grader
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U back-user" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/berniegach/socoles-backend:1.0.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    ports:
      # open only for local development
      - "127.0.0.1:5000:5000"
    environment:
      # libpq will pick these up
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=grader
      - PGUSER=back-user
      - PGPASSWORD=adgadjhasg^jagsfgc891732

  frontend:
    image: ghcr.io/berniegach/socoles-frontend:1.0.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_SOCOLES_API_URL=http://localhost:5000
      - NEXT_PUBLIC_SOCOLES_GRADE_PATH=/grade-queries
      - SOCOLES_INTERNAL_API_URL=http://backend:5000
      # Postgres connection for server-side Next.js code (pg Pool)
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=front-user
      - PGPASSWORD=ajsdfgfhjgdfhdg$87676g5
      - PGDATABASE=manageclass
      # HOST optional for Next.js listen address; uncomment if needed
      # - HOST=0.0.0.0
volumes:
  pg_data:
